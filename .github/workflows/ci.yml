name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Env audit (warn only)
        run: npm run check-env

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  playwright-e2e:
    runs-on: ubuntu-latest
    needs: build-and-check
    if: github.event_name == 'push' || github.event.pull_request.head.ref != ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Env audit (warn only)
        run: npm run check-env

      - name: Install Playwright Browsers
        uses: microsoft/playwright-github-action@v1
        with:
          run: npm run e2e -- --version

      - name: Run Playwright tests (chromium)
        run: |
          npm run e2e -- --project=chromium --workers=1
